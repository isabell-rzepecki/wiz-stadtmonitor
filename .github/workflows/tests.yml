# Bei Pull Requests und auf dem Hauptzweig: Python-Tests (Parser, Konfiguration, Kontrast) und Browser-Prüfung mit
# axe-core (WCAG 2.1 AA)
name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tests:
    # Push nur auf dem Hauptzweig (andere Zweige prüft der Pull Request)
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    # festes Abbild: Playwright 1.56 installiert Chromium-Abhängigkeiten nicht für ubuntu-latest = 26.04
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r tools/requirements.txt
      - name: Sperre gegen personenbezogene Rohdaten
        run: python tools/sperre.py --alle
      - name: Python-Tests
        run: python -m unittest discover -s tests -t .
      - name: Kontrast
        run: python tools/kontrast.py
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Browser-Tests
        run: |
          npm ci --prefix tests/browser
          (cd tests/browser && npx playwright install --with-deps chromium)
          bash tests/browser/run.sh
