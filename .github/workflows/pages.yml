# Täglich: Einladungen und Umringe der Bauleitplanung abrufen, Vorgänge erzeugen, prüfen und auf GitHub Pages
# veröffentlichen. Rohdaten (PDF, Text, Umringe) liegen nur im Zwischenspeicher des Workflows, nicht im Repository.
name: Daten und Seite

on:
  schedule:
    - cron: "17 4 * * *"   # täglich 04:17 UTC
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Werkzeuge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -r requirements.txt
      # Zwischenspeicher der Rohdaten: neue Einladungen werden nachgeladen, vorhandene nicht erneut abgerufen
      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/geo/restricted
          key: rohdaten-${{ github.run_id }}
          restore-keys: rohdaten-
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Pipeline (Abruf, Aufbau, Prüfung, Datenpaket, Seite)
        run: python -m pipeline all
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
