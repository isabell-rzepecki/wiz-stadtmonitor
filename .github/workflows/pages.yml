# Täglich: alle Quellen abrufen (python -m pipeline all), Vorgänge und Ebenen erzeugen, prüfen und auf GitHub Pages
# veröffentlichen. Rohdaten (PDF, Text, Umringe, Geodaten) liegen nur im Zwischenspeicher des Workflows, nicht im
# Repository. Auf anderen Zweigen läuft derselbe Aufbau als Probe, ohne Veröffentlichung und ohne neuen Zwischenspeicher.
name: Daten und Seite

on:
  schedule:
    - cron: "17 4 * * *"   # täglich 04:17 UTC
  push:
  workflow_dispatch:

permissions:
  contents: read  # Schreibrechte für Pages nur im Job deploy

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Werkzeuge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -r requirements.txt -r tools/requirements.txt
      # Zwischenspeicher der Rohdaten: neue Einladungen werden nachgeladen, vorhandene nicht erneut abgerufen.
      # Gespeichert wird nur auf dem Hauptzweig (andere Zweige lesen ihn), damit Probeläufe ihn nicht verdrängen.
      - uses: actions/cache/restore@v5
        with:
          path: |
            data/raw
            data/geo/restricted
          key: rohdaten-${{ github.run_id }}
          restore-keys: rohdaten-
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Pipeline (Abruf, Aufbau, Prüfung, Datenpaket, Seite)
        run: python -m pipeline all
      # auch nach einem Fehler in der Prüfung: die geladenen Rohdaten sind vollständig geschrieben und bleiben nutzbar
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
        with:
          path: |
            data/raw
            data/geo/restricted
          key: rohdaten-${{ github.run_id }}
      # Eigene Domain (Plesk): fertige Seite per SFTP hochladen, nur auf dem Hauptzweig und nur mit Zugangsdaten (Secrets
      # PLESK_*, docs/betrieb/plesk.md). Danach zeigt GitHub Pages nur noch eine Weiterleitung auf die Domain.
      - name: Hochladen auf den Webserver (Plesk)
        id: plesk
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        env:
          PLESK_HOST: ${{ secrets.PLESK_HOST }}
          PLESK_USER: ${{ secrets.PLESK_USER }}
          PLESK_PASSWORT: ${{ secrets.PLESK_PASSWORT }}
          PLESK_PFAD: ${{ secrets.PLESK_PFAD }}
          PLESK_PORT: ${{ secrets.PLESK_PORT }}
          PLESK_KNOWN_HOSTS: ${{ secrets.PLESK_KNOWN_HOSTS }}
        run: |
          if [ -z "$PLESK_HOST" ]; then
            echo "Keine Zugangsdaten (Secrets PLESK_*): die Seite bleibt nur auf GitHub Pages."
            echo "hochgeladen=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get install -y -qq lftp
          bash tools/plesk_hochladen.sh _site
          echo "hochgeladen=true" >> "$GITHUB_OUTPUT"
      - name: Weiterleitung für GitHub Pages
        if: ${{ steps.plesk.outputs.hochgeladen == 'true' }}
        run: |
          python -c "from pathlib import Path; from pipeline import site; site.weiterleitung(Path('_weiterleitung'))"
          rm -rf _site && mv _weiterleitung _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Quellwache (pipeline/quellwache.py): Ergebnis für den Job quellwache, nur auf dem Hauptzweig
      - uses: actions/upload-artifact@v6
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        with:
          name: quellwache
          path: data/export/quellwache.json
          if-no-files-found: ignore
          retention-days: 3

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Neue Lücken in den Bekanntmachungen oder Stillstand: Issue öffnen bzw. aktualisieren, sonst schließen. Eigener Job,
  # damit nur er Issues schreiben darf.
  quellwache:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: quellwache
          path: _quellwache
      - name: Issue zur Quellwache
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/quellwache_issue.py _quellwache/quellwache.json
